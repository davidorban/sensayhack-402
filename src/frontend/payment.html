<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; frame-src *; base-uri 'self'; form-action 'self'; child-src *;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Payment - Sensay x402 Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
      line-height: 1.6;
      background-color: #f8f9fa;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin: 20px 0;
    }
    h1 {
      color: #1a1a1a;
      margin-bottom: 5px;
      font-size: 24px;
      text-align: center;
    }
    .subtitle {
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
      text-align: center;
    }
    .payment-details {
      background: #f8f9ff;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .detail-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .detail-label {
      color: #666;
      font-size: 14px;
    }
    .detail-value {
      font-weight: 500;
      text-align: right;
      font-family: monospace;
    }
    .amount {
      font-size: 28px;
      font-weight: 700;
      color: #0052ff;
      margin: 20px 0;
      text-align: center;
    }
    button {
      background-color: #0052ff;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: all 0.2s ease;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 48px;
    }
    
    button:disabled {
      opacity: 0.8;
      cursor: not-allowed;
    }
    button:hover {
      background-color: #0039a6;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 82, 255, 0.2);
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .status {
      display: none;
      padding: 15px;
      margin: 20px 0;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }
    .success {
      background-color: #e6f7e6;
      border-left: 4px solid #4caf50;
    }
    .error {
      background-color: #fce8e8;
      color: #b91c1c;
      border-left: 4px solid #b91c1c;
    }
    .info {
      background-color: #e8f4fd;
      color: #1e429f;
      border-left: 4px solid #3b82f6;
    }
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .disclaimer {
      font-size: 12px;
      color: #888;
      margin-top: 25px;
      text-align: center;
      line-height: 1.5;
    }
    .loading {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }
    button:disabled .loading {
      display: inline-block;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .payment-id {
      font-size: 12px;
      color: #666;
      word-break: break-all;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>Sensay x402 Demo</h1>
      <div class="subtitle">Paywall Gateway</div>
    </div>
    
    <div class="payment-details">
      <div class="amount" id="amountDisplay">$0.01 USD</div>
      
      <div class="detail-row">
        <span class="detail-label">Payment ID</span>
        <span class="detail-value" id="paymentIdDisplay">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Recipient</span>
        <span class="detail-value">Sensay AI</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Network</span>
        <span class="detail-value">Base</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="detail-value" id="statusText">Pending</span>
      </div>
    </div>
    
    <div id="paymentStatus" class="status"></div>
    
    <button id="payButton">
      <span id="buttonLoader" class="loading"></span>
      <span id="buttonText">Approve Payment</span>
    </button>
    
    <div class="disclaimer">
      This is a demo payment page. No real funds will be transferred.
      <br>Powered by Sensay x402 Paywall Demo
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const paymentId = urlParams.get('paymentId');
      const userId = urlParams.get('userId');
      let amount = urlParams.get('amount') || '0.01';
      const currency = urlParams.get('currency') || 'USD';
      
      // Format amount to 2 decimal places
      amount = parseFloat(amount).toFixed(2);
      
      const statusEl = document.getElementById('paymentStatus');
      const payButton = document.getElementById('payButton');
      const buttonText = document.getElementById('buttonText');
      const buttonLoader = document.getElementById('buttonLoader');
      const amountDisplay = document.getElementById('amountDisplay');
      const paymentIdDisplay = document.getElementById('paymentIdDisplay');
      const statusText = document.getElementById('statusText');
      
      // Update UI with payment details
      amountDisplay.textContent = `${currency === 'USD' ? '$' : ''}${amount} ${currency}`;
      
      if (paymentId) {
        // Format payment ID for display
        const displayId = paymentId.length > 12 
          ? `${paymentId.substring(0, 6)}...${paymentId.substring(paymentId.length - 6)}`
          : paymentId;
          
        paymentIdDisplay.textContent = displayId;
        paymentIdDisplay.title = paymentId;
        
        // Show full payment ID on click
        paymentIdDisplay.style.cursor = 'pointer';
        paymentIdDisplay.style.textDecoration = 'underline';
        paymentIdDisplay.addEventListener('click', (e) => {
          e.preventDefault();
          alert(`Payment ID: ${paymentId}`);
        });
        
        // Check if payment is already verified
        checkPaymentStatus();
      } else {
        showError('No payment ID provided');
        payButton.disabled = true;
        return;
      }
      
      // Handle payment button click
      payButton.addEventListener('click', processPayment);
      
      // Auto-start payment if auto=1 is in URL (for testing)
      if (urlParams.get('auto') === '1') {
        processPayment();
      }
      
      async function checkPaymentStatus() {
        try {
          const response = await fetch(`/payment/status/${paymentId}?userId=${encodeURIComponent(userId || '')}`);
          const result = await response.json();
          
          if (result.paid) {
            // Payment already verified
            showStatus('Payment already verified', 'success');
            statusText.textContent = 'Completed';
            statusText.style.color = '#0a5c36';
            buttonText.textContent = 'Payment Complete';
            payButton.disabled = true;
            
            // Auto-close after 2 seconds if opened in a popup
            if (window.opener) {
              setTimeout(() => window.close(), 2000);
            }
            return true;
          }
          return false;
        } catch (error) {
          console.error('Error checking payment status:', error);
          return false;
        }
      }
      
      async function processPayment() {
        try {
          // Show loading state
          payButton.disabled = true;
          buttonText.textContent = 'Processing...';
          buttonLoader.style.display = 'inline-block';
          statusText.textContent = 'Processing...';
          
          // Hide any previous status messages
          statusEl.style.display = 'none';
          statusEl.className = 'status';
          
          // Simulate API call
          await new Promise(resolve => setTimeout(resolve, 2000));
          
          // Make the payment request
          const response = await fetch('/payment/verify', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ 
              paymentId,
              userId,
              amount,
              currency,
              proof: `mock-proof-${Date.now()}-${Math.random().toString(36).substring(2, 10)}`
            })
          });
          
          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || 'Payment verification failed');
          }
          
          const result = await response.json();
          
          // Payment successful
          showStatus('Payment successful! Redirecting you back...', 'success');
          statusText.textContent = 'Completed';
          statusText.style.color = '#0a5c36';
          buttonText.textContent = 'Payment Complete';
          
          // Auto-close after 2 seconds
          setTimeout(() => {
            // Notify the parent window if we're in a popup
            if (window.opener) {
              window.opener.postMessage({ 
                type: 'paymentComplete', 
                paymentId,
                userId: userId,
                amount: amount,
                currency: currency,
                success: true
              }, window.location.origin);
            }
            
            // Close the window
            window.close();
          }, 2000);
        } catch (error) {
          console.error('Payment error:', error);
          showStatus(`Payment failed: ${error.message}`, 'error');
          statusText.textContent = 'Failed';
          statusText.style.color = '#b91c1c';
          buttonText.textContent = 'Try Again';
          buttonLoader.style.display = 'none';
          payButton.disabled = false;
        }
      }
      
      function showStatus(message, type = 'info') {
        statusEl.textContent = message;
        statusEl.className = 'status ' + type;
        statusEl.style.display = 'block';
      }
      
      function showError(message) {
        showStatus(message, 'error');
      }
      
      // Handle messages from the parent window
      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) return;
        
        if (event.data.type === 'checkPaymentStatus') {
          // Respond with current payment status
          window.parent.postMessage({
            type: 'paymentStatus',
            paymentId,
            status: statusText.textContent.toLowerCase(),
            userId,
            amount,
            currency
          }, window.location.origin);
        }
      });
    });
  </script>
</body>
</html>
