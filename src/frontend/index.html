<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; frame-src *; base-uri 'self'; form-action 'self'; child-src *;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensay x402 Chat</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>Pay-to-Chat with Sensay</h1>
  <div id="chat-container">
    <div id="response">Send a message to start chatting...</div>
    <div id="input-area">
      <textarea id="message-input" placeholder="Type your message..."></textarea>
      <button id="send-button">Send</button>
    </div>
  </div>
  <div id="payment-instructions"></div>

  <script src="js/utils.js"></script>
  <script src="js/session.js"></script>
  <script src="js/payment.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
